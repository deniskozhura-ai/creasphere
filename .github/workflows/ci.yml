name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      ADMIN_PASSWORD: ci_test_admin_password_2026
      TEST_BASE_URL: http://127.0.0.1:3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup CI test environment
        run: |
          echo "ADMIN_PASSWORD=ci_test_admin_password_2026" > .env.local
          echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3001" >> .env.local

      - name: Run security tests
        run: |
          npx next dev --hostname 127.0.0.1 --port 3001 &
          SERVER_PID=$!
          node -e "
            const start = Date.now();
            async function check() {
              while (Date.now() - start < 45000) {
                try {
                  const res = await fetch('http://127.0.0.1:3001/api/products');
                  if (res.status === 200 || res.status === 401 || res.status === 503) {
                    console.log('Test server is ready!');
                    process.exit(0);
                  }
                } catch (e) {}
                await new Promise(r => setTimeout(r, 1000));
              }
              console.error('Server failed to start');
              process.exit(1);
            }
            check();
          "
          npm test
          kill $SERVER_PID || true

      - name: Run linter
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Audit package dependencies
        run: npm audit --audit-level=high
