name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      ADMIN_PASSWORD: ci_test_admin_password_2026
      TEST_BASE_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup CI test environment
        run: |
          echo "ADMIN_PASSWORD=ci_test_admin_password_2026" > .env.local
          echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3001" >> .env.local

      - name: Run security tests
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3001 > server.log 2>&1 &
          SERVER_PID=$!

          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/api/products || echo "000")
            if [ "$CODE" != "000" ]; then
              echo "Dev server is ready with HTTP $CODE after ${i}s"
              break
            fi
            sleep 1
          done

          if [ "$CODE" = "000" ]; then
            echo "ERROR: Server failed to start within 30s!"
            cat server.log
            exit 1
          fi

          if ! npm test; then
            echo "Security tests failed! Dev server log:"
            cat server.log
            kill -9 $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          kill -9 $SERVER_PID 2>/dev/null || true

      - name: Run linter
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Audit package dependencies
        run: npm audit --audit-level=high
